<title>Стог</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
@font-face{font-family:Nunito;font-weight:200 1000;font-display:swap;src:url('vendor/nunito-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Палитра — одно место (§9): поле на закате, стог, карты. Canvas читает цвета карт через getComputedStyle. Сцена одна
   и та же в любой теме (это игровое поле); светлая тема меняет только карточки экранов. */
:root{
  --bg:#141a0e; --field:#3e4a26; --field-edge:#161c0d; --panel:rgba(30,30,22,.94); --ink:#fff7e6; --muted:#d3c9b0;
  --accent:#ffc35c; --accent-ink:#3a2410; --danger:#ff7a6b; --line:rgba(255,255,255,.14);
  --card:#fffaf0; --card-red:#cf3a3f; --card-black:#1f2236; --back:#2e4583; --back-line:#f1e2bc; --ground:#7a5a39;
  --gold-hi:#fff0b8; --gold:#f2b740; --gold-lo:#b8741c; --gold-ink:#5a3410; --warm:#ff9a2e;
  --frame-w:430px;
}
@media (prefers-color-scheme: light){
  :root{ --panel:rgba(255,250,238,.96); --ink:#2a2416; --muted:#6c624c; --line:rgba(0,0,0,.12); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 Nunito, system-ui, sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 42%, var(--field) 0%, #2b3519 55%, var(--field-edge) 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{position:absolute;inset:0;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{pointer-events:none}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top);display:flex;align-items:center;gap:8px;padding:8px 10px;pointer-events:none;z-index:3;color:#fff7e6}
header .title{flex:1;text-align:center;line-height:1.05;text-shadow:0 1px 3px rgba(0,0,0,.6)}
header .title b{display:block;font-size:17px;font-weight:900;letter-spacing:.2px}
header .title span{font-size:12px;color:#e9dfc6;font-weight:800}
.hbtn{pointer-events:auto;width:40px;height:40px;border:0;border-radius:14px;background:rgba(18,20,12,.55);color:#fff7e6;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.hbtn svg{width:22px;height:22px}
.pill{pointer-events:auto;height:32px;border-radius:16px;background:rgba(18,20,12,.55);display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;font-weight:900;font-size:15px}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe39a,#f2b233 60%,#c98516);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
#tip{position:absolute;left:0;right:0;top:calc(58px + env(safe-area-inset-top));text-align:center;font-weight:800;font-size:14px;color:#fff7e6;
  text-shadow:0 1px 3px rgba(0,0,0,.75);pointer-events:none;z-index:2;padding:0 16px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff7e6;z-index:6;pointer-events:none}
#loupe{position:absolute;left:0;top:0;z-index:7;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 10px 8px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
#loupe.on{display:flex}
#loupe canvas{width:72px;height:101px;display:block}
#loupe small{font-weight:900;font-size:13px;color:var(--muted)}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:5;background:rgba(10,12,6,.5)}
#overlay.show{display:flex}
#overlay.sheet{background:rgba(10,12,6,.18);align-items:flex-end;padding-bottom:calc(var(--tray-h,200px) + 8px + env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;max-width:360px;width:100%;text-align:center;
  box-shadow:0 18px 40px rgba(0,0,0,.35);animation:pop .2s ease-out;max-height:calc(100% - 8px);overflow:auto} /* стартует с видимого состояния (§9) */
@keyframes pop{from{transform:scale(.95)}to{transform:scale(1)}}
.card h2{margin:2px 0 6px;font-size:23px;font-weight:900}
.card p{color:var(--muted);margin:0 0 14px;font-size:15px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit}
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:900;font-size:17px;cursor:pointer;color:var(--ink);background:rgba(127,127,127,.2)}
.btn.primary{background:linear-gradient(#ffd27f,#f4a83c);color:var(--accent-ink);box-shadow:0 3px 0 #b8701f}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}
.big-gold{width:84px;height:118px;margin:2px auto 10px;border-radius:12px;background:linear-gradient(150deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
  box-shadow:0 6px 18px rgba(255,190,80,.45),inset 0 0 0 3px rgba(120,70,10,.35);display:flex;align-items:center;justify-content:center;
  font:900 64px/1 Nunito, system-ui, sans-serif;color:var(--gold-ink)}
.stats{display:flex;justify-content:center;gap:18px;margin:0 0 14px;font-weight:900}
.stats small{display:block;font-size:12px;color:var(--muted);font-weight:800}
table.res{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 12px}
table.res th{font-size:11px;color:var(--muted);font-weight:800;text-align:center;padding:4px 2px;border-bottom:1px solid var(--line);line-height:1.1}
table.res td{text-align:center;padding:5px 2px;border-bottom:1px solid var(--line);font-weight:800}
table.res tr.tot td{border-bottom:0;color:var(--accent)}
.goal{color:var(--muted);font-size:12px;text-align:left;margin:0 0 12px;line-height:1.35}
.help li{text-align:left;margin:0 0 8px;color:var(--muted)}
.help{padding-left:20px;margin:0 0 14px}
#toast{position:absolute;left:50%;top:calc(86px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(20,22,12,.9);color:#fff7e6;padding:8px 14px;border-radius:12px;
  pointer-events:none;opacity:.98;transition:opacity .25s;z-index:4;font-weight:800;white-space:nowrap}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card{animation:none} #toast{transition:none} }

// ---------------------------------------------------------------------------
// Звук: WebAudio-синтез без файлов (§8), ленивый старт по первому жесту; голоса из «Света в окнах»
// ---------------------------------------------------------------------------
const Audio = {
  ac: null, out: null, cache: {},
  init(){
    if (this.ac){ if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.out = this.ac.createGain(); this.out.gain.value = 0.85; this.out.connect(this.ac.destination);
    } catch (e) { this.ac = null; }
  },
  ok(){ return this.ac && !G.save.muted; },
  pluckBuf(freq){                      // струна: шумовой всплеск в кольцевом буфере, усреднение — затухание
    const key = Math.round(freq * 10);
    if (this.cache[key]) return this.cache[key];
    const sr = this.ac.sampleRate, N = Math.max(2, Math.round(sr / freq)), len = Math.floor(sr * 1.6);
    const buf = this.ac.createBuffer(1, len, sr), d = buf.getChannelData(0), ring = new Float32Array(N), rnd = mulberry32(key);
    for (let i = 0; i < N; i++) ring[i] = rnd() * 2 - 1;
    let p = 0;
    for (let i = 0; i < len; i++){ const a = ring[p], b = ring[(p + 1) % N]; d[i] = a; ring[p] = (a + b) * 0.5 * 0.9962; p = (p + 1) % N; }
    return (this.cache[key] = buf);
  },
  pluck(freq, vol, at){
    if (!this.ok()) return;
    const t = (at || 0) + this.ac.currentTime, src = this.ac.createBufferSource(), g = this.ac.createGain(), f = this.ac.createBiquadFilter();
    src.buffer = this.pluckBuf(freq); f.type = 'lowpass'; f.frequency.value = 2800;
    g.gain.value = vol || 0.3; src.connect(f).connect(g).connect(this.out); src.start(t);
  },
  bell(freq, vol, dur, at){
    if (!this.ok()) return;
    const t = (at || 0) + this.ac.currentTime;
    [[1, 1], [2.76, 0.35], [5.4, 0.15]].forEach(([m, a]) => {
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = 'sine'; o.frequency.value = freq * m;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime((vol || 0.18) * a, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 1.1) / m ** 0.3);
      o.connect(g).connect(this.out); o.start(t); o.stop(t + (dur || 1.1) + 0.05);
    });
  },
  // шумовой всплеск с фильтром, который едет от f0 к f1 (шорох карты, щелчок, гул оползня); at — задержка, с
  burst(o){
    if (!this.ok()) return;
    const t = this.ac.currentTime + (o.at || 0), sr = this.ac.sampleRate, len = Math.max(1, Math.floor(sr * o.dur));
    const buf = this.ac.createBuffer(1, len, sr), d = buf.getChannelData(0), rnd = mulberry32(len + 7);
    for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
    const src = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    src.buffer = buf; f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7;
    f.frequency.setValueAtTime(o.f0, t); f.frequency.exponentialRampToValueAtTime(o.f1 || o.f0, t + o.dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol, t + (o.att || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f).connect(g).connect(this.out); src.start(t); src.stop(t + o.dur + 0.02);
  },
  tok(f0, f1, dur, vol, at){             // мягкий тональный «тук»: синус с падением высоты
    if (!this.ok()) return;
    const t = this.ac.currentTime + (at || 0), o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + 0.02);
  },
  SCALE: [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3, 784.0, 880.0],   // мажорная пентатоника: серия идёт вверх
  play(streak){ this.burst({ dur: 0.022, vol: 0.16, type: 'highpass', f0: 3200, f1: 2200 }); this.tok(900, 620, 0.05, 0.05);
    this.pluck(this.SCALE[Math.min(this.SCALE.length - 1, Math.max(0, streak - 1))] * 2, 0.3); log('sound', 'play', 'streak=' + streak); },
  flip(){ this.burst({ dur: 0.06, vol: 0.05, type: 'bandpass', f0: 5200, f1: 2600, q: 1.2 }); log('sound', 'flip'); },
  wrong(){ this.tok(240, 170, 0.09, 0.09); log('sound', 'wrong'); },
  draw(){ this.burst({ dur: 0.13, vol: 0.06, type: 'lowpass', f0: 4200, f1: 700, att: 0.03 }); this.burst({ dur: 0.018, vol: 0.2, type: 'highpass', f0: 2600, f1: 1800, at: 0.11 });
    this.tok(360, 230, 0.12, 0.13, 0.11); log('sound', 'draw'); },
  spark(){ [0, 4, 7, 12].forEach((d, i) => this.bell(1046.5 * 2 ** (d / 12), 0.08, 0.9, i * 0.07)); this.burst({ dur: 0.7, vol: 0.05, type: 'bandpass', f0: 600, f1: 2400, att: 0.25, at: 0.2 }); log('sound', 'spark'); },
  coin(){ this.bell(1568, 0.09, 0.6); this.bell(2093, 0.06, 0.5, 0.06); log('sound', 'coin'); },
  plus5(){ this.burst({ dur: 0.35, vol: 0.08, type: 'lowpass', f0: 3600, f1: 900, att: 0.05 }); this.bell(1174.7, 0.1, 0.8, 0.3); log('sound', 'plus5'); },
  slide(){ this.burst({ dur: 1.1, vol: 0.22, type: 'lowpass', f0: 420, f1: 90, att: 0.08 });
    for (let i = 0; i < 9; i++) this.burst({ dur: 0.03, vol: 0.06, type: 'highpass', f0: 2400 + i * 120, f1: 1600, at: 0.15 + i * 0.07 }); log('sound', 'slide'); },
  win(){ [523.3, 659.3, 784.0, 1046.5].forEach((f, i) => this.pluck(f, 0.26, i * 0.08)); this.bell(1568, 0.12, 1.6, 0.36); this.bell(2093, 0.08, 1.4, 0.5);
    this.burst({ dur: 0.9, vol: 0.07, type: 'lowpass', f0: 700, f1: 160, att: 0.3, at: 0.6 }); log('sound', 'win'); },
};
let touched = false;                       // вибрация только после первого касания
function buzz(ms){ if (!touched) return; try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ---------------------------------------------------------------------------
// Атлас карт: рисуется кодом один раз (масти путями, не глифами: ♥♦ на iOS бывают эмодзи). 12×9 ячеек 160×224:
// 0..51 — лица, 52 — рубашка, 53..104 — дальние лица (LOD, ранг крупнее), 105 — «земля», 106/107 — золотой туз.
// ---------------------------------------------------------------------------
const ATLAS_PX = 2048, CELL_W = 160, CELL_H = 224, COLS = 12;
const CELL_BACK = 52, CELL_FAR0 = 53, CELL_GROUND = 105, CELL_GOLD = 106, CELL_GOLD_FAR = 107;
const FONT = 'Nunito, system-ui, -apple-system, Roboto, sans-serif';
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
let PAL = null;
function palette(){ if (!PAL) PAL = { card: css('--card'), red: css('--card-red'), black: css('--card-black'), back: css('--back'), backLine: css('--back-line'),
  ground: css('--ground'), goldHi: css('--gold-hi'), gold: css('--gold'), goldLo: css('--gold-lo'), goldInk: css('--gold-ink'), warm: css('--warm') }; return PAL; }
function cellXY(i){ return [(i % COLS) * CELL_W, Math.floor(i / COLS) * CELL_H]; }
function rr(c, x, y, w, h, r){ c.beginPath(); c.roundRect(x, y, w, h, r); }
// Масть кодом (как в «Свете в окнах»). x, y — центр, s — размер.
function drawSuit(c, suit, x, y, s){
  c.beginPath();
  if (suit === 1){        // червы
    c.moveTo(x, y + s * 0.42);
    c.bezierCurveTo(x - s * 0.9, y - s * 0.15, x - s * 0.42, y - s * 0.75, x, y - s * 0.28);
    c.bezierCurveTo(x + s * 0.42, y - s * 0.75, x + s * 0.9, y - s * 0.15, x, y + s * 0.42);
  } else if (suit === 2){ // бубны
    c.moveTo(x, y - s * 0.55); c.lineTo(x + s * 0.4, y); c.lineTo(x, y + s * 0.55); c.lineTo(x - s * 0.4, y); c.closePath();
  } else if (suit === 0){ // пики
    c.moveTo(x, y - s * 0.55);
    c.bezierCurveTo(x + s * 0.9, y + s * 0.05, x + s * 0.35, y + s * 0.55, x, y + s * 0.16);
    c.bezierCurveTo(x - s * 0.35, y + s * 0.55, x - s * 0.9, y + s * 0.05, x, y - s * 0.55);
    c.moveTo(x, y + s * 0.1); c.lineTo(x + s * 0.2, y + s * 0.55); c.lineTo(x - s * 0.2, y + s * 0.55); c.closePath();
  } else {                // трефы
    const r = s * 0.24;
    c.arc(x, y - s * 0.26, r, 0, Math.PI * 2); c.moveTo(x - s * 0.24 + r, y + s * 0.06); c.arc(x - s * 0.24, y + s * 0.06, r, 0, Math.PI * 2);
    c.moveTo(x + s * 0.24 + r, y + s * 0.06); c.arc(x + s * 0.24, y + s * 0.06, r, 0, Math.PI * 2);
    c.moveTo(x, y); c.lineTo(x + s * 0.16, y + s * 0.55); c.lineTo(x - s * 0.16, y + s * 0.55); c.closePath();
  }
  c.fill();
}
// Ранг по центру по горизонтали, сжатый по ширине до maxW; 6 и 9 подчёркнуты (на повёрнутой карте их путают).
function drawRank(c, txt, cx, base, size, maxW, underline){
  c.font = '900 ' + size + 'px ' + FONT; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  const m = c.measureText(txt).width, k = Math.min(1, maxW / m);
  c.save(); c.translate(cx, base); c.scale(k, 1); c.fillText(txt, -m / 2, 0); c.restore();
  if (underline){ const uw = m * k * 0.78; c.fillRect(cx - uw / 2, base + size * 0.07, uw, size * 0.075); }
}
// Лицо карты: ранг почти во всю карту (в яме карта ~50×70 px → ранг ~35 px), масть мелко внизу.
function drawFace(c, id, x, y, w, h, far){
  const P = palette(), r = rk(id), s = Math.floor(id / 13) % 4, red = s === 1 || s === 2;
  c.fillStyle = P.card; rr(c, x + 4, y + 4, w - 8, h - 8, 15); c.fill();
  c.lineWidth = 4; c.strokeStyle = 'rgba(40,30,20,.55)'; c.stroke();
  c.fillStyle = red ? P.red : P.black;
  drawRank(c, RANKS[r], x + w / 2, y + h * (far ? 0.68 : 0.64), Math.round(h * (far ? 0.8 : 0.72)), w * 0.86, r === 5 || r === 8);
  drawSuit(c, s, x + w / 2, y + h * (far ? 0.86 : 0.84), h * (far ? 0.15 : 0.17));
}
function drawBack(c, x, y, w, h){
  const P = palette();
  c.fillStyle = P.back; rr(c, x + 4, y + 4, w - 8, h - 8, 15); c.fill();
  c.lineWidth = 4; c.strokeStyle = 'rgba(10,14,40,.7)'; c.stroke();
  c.save(); rr(c, x + 16, y + 16, w - 32, h - 32, 8); c.clip();
  c.strokeStyle = P.backLine; c.globalAlpha = 0.5; c.lineWidth = 3;
  for (let k = -h; k < w + h; k += 22){ c.beginPath(); c.moveTo(x + k, y); c.lineTo(x + k + h, y + h); c.moveTo(x + k + h, y); c.lineTo(x + k, y + h); c.stroke(); }
  c.restore(); c.globalAlpha = 1;
  c.strokeStyle = P.backLine; c.lineWidth = 5; rr(c, x + 14, y + 14, w - 28, h - 28, 9); c.stroke();
}
function drawGround(c, x, y, w, h){
  const P = palette(), rnd = mulberry32(99);
  c.fillStyle = P.ground; rr(c, x + 4, y + 4, w - 8, h - 8, 15); c.fill();
  c.save(); rr(c, x + 4, y + 4, w - 8, h - 8, 15); c.clip();
  for (let i = 0; i < 70; i++){ c.fillStyle = rnd() < 0.5 ? 'rgba(40,25,10,.35)' : 'rgba(200,170,120,.18)'; c.beginPath(); c.arc(x + rnd() * w, y + rnd() * h, 2 + rnd() * 6, 0, 7); c.fill(); }
  c.restore();
  c.lineWidth = 4; c.strokeStyle = 'rgba(30,20,8,.5)'; rr(c, x + 4, y + 4, w - 8, h - 8, 15); c.stroke();
}
// Золотой туз: золото с бликом, крупное «A» и звезда — видно сквозь щели в куче.
function drawGold(c, x, y, w, h, far){
  const P = palette(), g = c.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, P.goldHi); g.addColorStop(0.45, P.gold); g.addColorStop(1, P.goldLo);
  c.fillStyle = g; rr(c, x + 4, y + 4, w - 8, h - 8, 15); c.fill();
  c.lineWidth = 6; c.strokeStyle = 'rgba(110,60,8,.75)'; c.stroke();
  c.strokeStyle = 'rgba(255,250,220,.75)'; c.lineWidth = 3; rr(c, x + 14, y + 14, w - 28, h - 28, 9); c.stroke();
  c.fillStyle = P.goldInk;
  drawRank(c, 'A', x + w / 2, y + h * (far ? 0.66 : 0.6), Math.round(h * (far ? 0.72 : 0.6)), w * 0.8, false);
  const sx = x + w / 2, sy = y + h * 0.8, R1 = h * 0.085, R0 = R1 * 0.42;
  c.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R0 : R1; c.lineTo(sx + Math.cos(a) * r, sy + Math.sin(a) * r); } c.closePath(); c.fill();
}
function buildAtlas(){
  const cv = document.createElement('canvas'); cv.width = cv.height = ATLAS_PX; const c = cv.getContext('2d');
  c.fillStyle = '#1b1a14'; c.fillRect(0, 0, ATLAS_PX, ATLAS_PX);
  for (let id = 0; id < 52; id++){ let [x, y] = cellXY(id); drawFace(c, id, x, y, CELL_W, CELL_H, false); [x, y] = cellXY(CELL_FAR0 + id); drawFace(c, id, x, y, CELL_W, CELL_H, true); }
  let [x, y] = cellXY(CELL_BACK); drawBack(c, x, y, CELL_W, CELL_H);
  [x, y] = cellXY(CELL_GROUND); drawGround(c, x, y, CELL_W, CELL_H);
  [x, y] = cellXY(CELL_GOLD); drawGold(c, x, y, CELL_W, CELL_H, false);
  [x, y] = cellXY(CELL_GOLD_FAR); drawGold(c, x, y, CELL_W, CELL_H, true);
  return cv;
}
function drawCell(c, cell, x, y, w, h){ const [sx, sy] = cellXY(cell); c.drawImage(S.atlas, sx, sy, CELL_W, CELL_H, x, y, w, h); }

// ---------------------------------------------------------------------------
// Сцена: укладка стога по карте высот (позже упавшая ложится сверху, наклон по склону), один InstancedMesh.
// ---------------------------------------------------------------------------
const S = { ok: false, renderer: null, scene: null, camera: null, mesh: null, aData: null, aAnim: null, atlas: null,
  Y: null, mats: null, invs: null, instOf: null, face: null, open0: null, maxH: 1, ys: 1, cssW: 375, cssH: 700, DPR: 1, faceRot: 0 };
// Высота и наклон каждой карты: карта падает в точку стога из сима, ложится на карту высот (12–20 проб), впечатывается в неё.
function layPile(P){
  const N = P.N, W = CFG.CARD_W, H = CFG.CARD_H, res = CFG.HF_RES, TH = CFG.THICK;
  let ext = 0; for (let i = 0; i < N; i++) ext = Math.max(ext, Math.abs(P.x[i]), Math.abs(P.y[i])); ext += 1.5;
  const Gn = Math.ceil(2 * ext / res), hf = new Float32Array(Gn * Gn);
  const hAt = (x, z) => { const i = Math.floor((x + ext) / res), j = Math.floor((z + ext) / res); return (i < 0 || j < 0 || i >= Gn || j >= Gn) ? 0 : hf[j * Gn + i]; };
  const SU = [-0.42, -0.14, 0.14, 0.42], SV = [-0.45, -0.22, 0, 0.22, 0.45];
  const Y = new Float32Array(N), mats = new Float32Array(N * 16), invs = new Float32Array(N * 16);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1), pos = new THREE.Vector3();
  let maxH = 0;
  for (let k = 0; k < N; k++){
    const x = P.x[k], z = P.y[k], c = P.c[k], s = P.s[k];
    const smp = []; let hl = 0, hr = 0, hb = 0, ht = 0;
    for (const u of SU) for (const v of SV){
      const uu = u * W, vv = v * H, hh = hAt(x + uu * c - vv * s, z + uu * s + vv * c); smp.push([uu, vv, hh]);
      if (u < 0) hl = Math.max(hl, hh); if (u > 0) hr = Math.max(hr, hh); if (v < 0) hb = Math.max(hb, hh); if (v > 0) ht = Math.max(ht, hh);
    }
    const su = Math.max(-CFG.TILT_MAX, Math.min(CFG.TILT_MAX, (hr - hl) / (0.84 * W))), sv = Math.max(-CFG.TILT_MAX, Math.min(CFG.TILT_MAX, (ht - hb) / (0.9 * H)));
    let y0 = 0; for (const [uu, vv, hh] of smp) y0 = Math.max(y0, hh - su * uu - sv * vv);
    y0 += TH * 0.5; Y[k] = y0; if (y0 > maxH) maxH = y0;
    const r0 = 0.62, i0 = Math.max(0, Math.floor((x - r0 + ext) / res)), i1 = Math.min(Gn - 1, Math.floor((x + r0 + ext) / res));
    const j0 = Math.max(0, Math.floor((z - r0 + ext) / res)), j1 = Math.min(Gn - 1, Math.floor((z + r0 + ext) / res));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++){
      const px = i * res - ext + res / 2 - x, pz = j * res - ext + res / 2 - z, u = px * c + pz * s, v = -px * s + pz * c;
      if (Math.abs(u) <= W / 2 && Math.abs(v) <= H / 2){ const hh = y0 + su * u + sv * v + TH * 0.5; if (hh > hf[j * Gn + i]) hf[j * Gn + i] = hh; }
    }
    // поворот: вокруг вертикали — угол карты, наклоны по ширине (su) и высоте (sv) — по склону
    e.set(-Math.atan(sv), -Math.atan2(s, c), Math.atan(su), 'YXZ'); q.setFromEuler(e); pos.set(x, y0, z); m.compose(pos, q, one);
    m.toArray(mats, k * 16); m.invert().toArray(invs, k * 16);
  }
  S.Y = Y; S.mats = mats; S.invs = invs; S.maxH = maxH;
}
const VS = `
  attribute vec4 aData;   // x — ближняя ячейка, y — дальняя, z — тень (+2 — тёплый край), w — вид: 0 стог, 1 вне ямы, 2 закрыта, 3 открыта, 5 земля, 6 золото, −1 снята
  attribute vec2 aAnim;   // x — начало, с; y — 1 переворот, 2 падение оползнем
  uniform float uPxPerUnit, uLodPx, uCols, uTime, uFlip, uSlide, uFaceRot, uYS; uniform vec2 uCell;   // uYS — сплющивание стога по высоте (анимации его не сплющивает)
  varying vec2 vUv; varying vec2 vLoc; varying float vShade; varying float vFlag; varying float vWarm;

window.addEventListener('hashchange', () => routeHash(location.hash.slice(1)));
let toastUntil = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.remove('hide'); toastUntil = now() + CFG.TOAST_MS; }
function tip(txt, ms){ $('tip').textContent = txt || ''; G.tipUntil = ms ? now() + ms : 0; }
function hud(){
  $('hud-coins').textContent = G.save.coins;
  $('hud-title').textContent = G.L && G.screen !== 'menu' ? 'Яма ' + (G.li + 1) + ' из ' + LEVELS.length : 'Стог';
  if (G.aliveNow){ const n = cardsLeft(); $('hud-sub').textContent = 'в стоге ' + n.toLocaleString('ru-RU') + ' ' + plural(n, 'карта', 'карты', 'карт'); }
  $('mute-wave').style.display = G.save.muted ? 'none' : ''; $('mute-x').style.display = G.save.muted ? '' : 'none';
}
$('btn-menu').onclick = () => { Audio.init(); log('input', 'button', 'menu'); goto(G.screen === 'menu' ? (G.L ? 'game' : 'menu') : 'menu'); };
$('btn-mute').onclick = () => { Audio.init(); G.save.muted = !G.save.muted; save(); hud(); log('input', 'button', 'mute=' + G.save.muted); };

// ---------------------------------------------------------------------------
// Ввод: Pointer Events, порог TAP_SLOP 10 px, pointercancel = pointerup (§3); лупа по удержанию; щипок
// ---------------------------------------------------------------------------
const gameEl = $('game');
let down = null, pinch = null;
const touches = new Map();
function local(e){ const r = $('gl').getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function inTray(p){ return G.trayK > 0.5 && p.y / scale > curGeo().top - 6; }
function inRect(p, g, pad){ const x = p.x / scale, y = p.y / scale; return Math.abs(x - g.x) <= g.w / 2 + pad && Math.abs(y - g.y) <= g.h / 2 + pad; }
gameEl.addEventListener('pointerdown', (e) => {
  Audio.init(); touched = true; G.lastInput = now();
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { gameEl.setPointerCapture(e.pointerId); } catch (err) {}
  if (touches.size === 2 && home){ const [a, b] = [...touches.values()]; pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: zoom }; down = null; hideLoupe(); log('input', 'pinch'); return; }
  if (touches.size > 2) return;
  const p = local(e);
  down = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, lt: now(), t0: now(), te: e.timeStamp || now(), moved: false, vy: 0, vp: 0, hold: -1, loupe: false, ux: p.x / scale, uy: p.y / scale };
  if (spin){ spin = null; }
  if (G.pitOn && !inTray(p) && (G.phase === 'play' || G.phase === 'stuck')){ const c = pickCard(p.x, p.y); if (c >= 0) down.hold = c; }
});
gameEl.addEventListener('pointermove', (e) => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size >= 2){
    const [a, b] = [...touches.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoom = Math.max(CFG.ZOOM_MIN, Math.min(CFG.ZOOM_MAX, pinch.z0 * pinch.d0 / Math.max(1, d)));
    return;
  }
  if (!down || e.pointerId !== down.id) return;
  if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > CFG.TAP_SLOP_PX){ down.moved = true; hideLoupe(); }
  if (!down.moved || camTw || !home) return;
  const dx = e.clientX - down.lx, dy = e.clientY - down.ly, t = now(), dt = Math.max(1, t - down.lt);
  CAM.yaw -= dx * CFG.DRAG_RAD_PER_PX; CAM.pitch += dy * CFG.DRAG_RAD_PER_PX; clampOrbit();
  down.vy = down.vy * 0.5 + (-dx * CFG.DRAG_RAD_PER_PX / dt * 1000) * 0.5;
  down.vp = down.vp * 0.5 + (dy * CFG.DRAG_RAD_PER_PX / dt * 1000) * 0.5;
  down.lx = e.clientX; down.ly = e.clientY; down.lt = t;
});
function onUp(e){
  touches.delete(e.pointerId);
  if (pinch){ if (touches.size < 2){ pinch = null; log('input', 'pinch.end', 'zoom=' + zoom.toFixed(2)); } return; }
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  // граница одна — по времени самих событий (урок tap-hold-gap): отпустил раньше LOUPE_MS = тап, даже если занятый кадр
  // успел показать лупу; позже — лупа, не ход
  const held = (e.timeStamp || now()) - d.te;
  if (d.loupe){ hideLoupe(); if (held >= CFG.LOUPE_MS || d.moved){ log('input', 'loupe.release', 'ms=' + Math.round(held)); return; } G.lv.loupes--; }
  if (d.moved){ if (now() - d.lt < 80 && !camTw) spin = { t: now(), yaw: CAM.yaw, pitch: CAM.pitch, vy: d.vy, vp: d.vp }; log('input', 'spin'); return; }
  if (e.type === 'pointercancel') return;
  tapAt(local(e));
}
gameEl.addEventListener('pointerup', onUp); gameEl.addEventListener('pointercancel', onUp);
gameEl.addEventListener('wheel', (e) => { e.preventDefault(); if (home) zoom = Math.max(CFG.ZOOM_MIN, Math.min(CFG.ZOOM_MAX, zoom * (e.deltaY > 0 ? 1.08 : 0.93))); }, { passive: false });
function tapAt(p){
  if (G.screen !== 'game') return;
  if (G.phase === 'over'){
    const s = cardCenter(G.L.gold), dd = Math.hypot(p.x - s.x, p.y - s.y);
    log('input', 'tap.over', 'dist=' + Math.round(dd));
    if (dd <= CFG.SPARK_TAP_PX) sparkFound(); else G.lv.overMiss++;
    return;
  }
  if (G.phase !== 'play') return;
  if (inTray(p)){ if (inRect(p, deckGeo(), 10)) deckTap(); return; }
  const hit = pickCard(p.x, p.y), q = hit >= 0 ? G.nodeOf[hit] : -1;
  if (q >= 0 && G.st.present[q] && G.st.cover[q] === 0){ playNode(q, 'direct'); return; }
  const a = assistNode(p.x, p.y);
  if (a >= 0){ G.lv.assist++; playNode(a, 'assist'); return; }
  if (q >= 0 && G.st.present[q]){ G.lv.closed++; deny(hit); Audio.wrong(); log('input', 'tap.closed'); return; }
  if (hit >= 0){ G.lv.dead++; deny(hit); Audio.wrong(); log('input', 'tap.dead', S.open0[hit] || nodeCover(hit) ? 'stack' : 'ground'); return; }
  log('input', 'tap.empty');
}
function nodeCover(i){ const P = pile(); for (const j of P.above[i]) if (G.aliveNow[j]) return 1; return 0; }
function showLoupe(i, d){
  const q = G.nodeOf[i], st = G.st, L = G.L, c = $('loupe-cv').getContext('2d');
  let cell, txt;
  if (q === L.goldIdx){ cell = CELL_GOLD; txt = 'золотой туз'; }
  else if (q >= 0 && st.present[q] && st.cover[q] > 0){ cell = CELL_BACK; txt = 'закрыта'; }
  else if (q >= 0 && st.present[q]){ cell = st.tab[q]; txt = ok(rk(st.top), rk(st.tab[q])) ? 'можно снять' : 'не подходит'; }
  else if (!S.open0[i] && !nodeCover(i)){ cell = CELL_GROUND; txt = 'земля'; }
  else { cell = S.face[i]; txt = 'не в яме'; }
  c.clearRect(0, 0, 144, 202); const [sx, sy] = cellXY(cell); c.drawImage(S.atlas, sx, sy, CELL_W, CELL_H, 0, 0, 144, 202);
  $('loupe-txt').textContent = txt;
  const el = $('loupe'), fr = $('frame').getBoundingClientRect(), x = d.x - fr.left, y = d.y - fr.top;
  el.classList.add('on'); const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(fr.width - w - 8, x - w / 2)) + 'px'; el.style.top = Math.max(8, y - h - 44) + 'px';
  G.lv.loupes++; log('input', 'loupe', txt);
}
function hideLoupe(){ $('loupe').classList.remove('on'); }
document.addEventListener('keydown', (e) => {          // дубли на клавиатуру для отладки (§3)
  if (e.key === 'd') deckTap();
  if (e.key === 's' || e.key === ' ') sparkFound();
  if (e.key === 'b') STOG.bot();
  if (e.key === 'r' && G.L) startLevel(G.li);
  if (e.key === 'm') goto('menu');
  if (e.key === 'ArrowLeft'){ CAM.yaw += 0.15; clampOrbit(); } if (e.key === 'ArrowRight'){ CAM.yaw -= 0.15; clampOrbit(); }
});

// ---------------------------------------------------------------------------
// Размер: resize + orientationchange + периодический пересчёт (§2)
// ---------------------------------------------------------------------------
function fit(){
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  const fs = getComputedStyle($('frame'));
  safeT = parseFloat(fs.paddingTop) || 0; safeB = parseFloat(fs.paddingBottom) || 0;
  S.DPR = Math.min(window.devicePixelRatio || 1, 2); S.cssW = r.width; S.cssH = r.height;
  scale = r.width / VW; H = r.height / scale;
  uicv.width = Math.round(r.width * S.DPR); uicv.height = Math.round(r.height * S.DPR);
  if (S.renderer){ S.renderer.setPixelRatio(S.DPR); S.renderer.setSize(r.width, r.height, false); }
  document.documentElement.style.setProperty('--tray-h', Math.round(TRAY_H * scale) + 'px');
  if (home && home.kind === 'pit' && G.L && !camTw){ const f = frameFor(G.L, G.st, home.yaw); home = { ...home, tx: f.tx, ty: f.ty, tz: f.tz, dist: f.dist, pxu: f.pxu }; Object.assign(CAM, { tx: f.tx, ty: f.ty, tz: f.tz }); }
}
let fitTimer = 0, lastSize = '';
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(() => { const r = $('game').getBoundingClientRect(), k = r.width + 'x' + r.height; if (k !== lastSize){ lastSize = k; fit(); } }, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; log('event', G.paused ? 'pause' : 'resume'); });

// ---------------------------------------------------------------------------
// Кадр: rAF + сторож setInterval; безопасно, потому что время абсолютное (§4). Кадр под try/catch.
// ---------------------------------------------------------------------------
let lastFrame = 0, lastRaf = 0;
const fpsRing = [];
function tick(t, fromRaf){
  if (!S.ok) return;
  // панель снизу выезжает в яме и прячется на общем плане
  const wantTray = G.screen !== 'menu' && G.L && !['over', 'pullout', 'idle'].includes(G.phase) ? 1 : 0;
  G.trayK += (wantTray - G.trayK) * Math.min(1, REDUCED ? 1 : 0.14);
  if (G.screen === 'menu' && !camTw && home && home.kind === 'over') CAM.yaw += 0.0012;          // стог медленно крутится за меню
  updateCamera(t);
  const u = S.mesh.material.uniforms, dimTo = G.pitOn ? 1 : 0; u.uDim.value += (dimTo - u.uDim.value) * 0.08; u.uTime.value = (t - T0) / 1000;
  placeCamera(t); S.renderer.render(S.scene, S.camera);
  // таймеры фаз
  if (G.phase === 'stuck' && t >= G.phaseUntil){ if (nearMiss(G.st)) offerPlus5(); else landslide(); }
  if (G.phase === 'slide' && t >= G.phaseUntil){ G.phase = 'play'; log('fx.end', 'slide'); G.lastInput = t; checkStuck(); reframe(); }
  if (G.phase === 'won' && t >= G.phaseUntil){ G.phase = 'idle'; finishLevel(); }
  if (down && !down.moved && down.hold >= 0 && !down.loupe && t - down.t0 >= CFG.LOUPE_MS){ down.loupe = true; showLoupe(down.hold, down); }
  if (G.tipUntil && t > G.tipUntil){ tip(''); }
  if (G.li === 1 && G.phase === 'play'){ const w = playable(G.L, G.st).length ? goalTip() : G.st.stock.length ? 'Нет хода — тапни колоду' : ''; if ($('tip').textContent !== w) tip(w, 0); }
  if (toastUntil && t > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
  renderUI(t);
  // к/с: только кадры rAF на игровом поле
  if (fromRaf){
    const dt = t - lastRaf; lastRaf = t;
    if (dt > 0 && dt < 250){
      fpsRing.push(dt); if (fpsRing.length > 240) fpsRing.shift();
      if (G.lv && G.screen === 'game' && ['over', 'play', 'stuck', 'dive'].includes(G.phase)){ G.lv.frames++; G.lv.frameMs += dt; if (G.lv.dts.length < 4000) G.lv.dts.push(dt); }
    }
  }
}
function safeTick(t, fromRaf){ try { tick(t, fromRaf); } catch (err) { if (G.errors.length < 20) G.errors.push(String(err && err.stack || err)); console.error(err); } }
function frame(){ const t = now(); lastFrame = t; if (!G.paused) safeTick(t, true); requestAnimationFrame(frame); }
setInterval(() => { const t = now(); if (t - lastFrame > 120 && !G.paused){ lastFrame = t; safeTick(t, false); } }, 40);

// ---------------------------------------------------------------------------
// Дебаг-хук (§6): состояние, любой экран, прогон времени, бот, точки для проверки касаниями
// ---------------------------------------------------------------------------
window.STOG = {
  G, CFG, CAM, S, get P(){ return pile(); }, quad(i){ return cardQuad(i); },
  state(){
    const st = G.st, L = G.L;
    return { screen: G.screen, phase: G.phase, level: G.li + 1, attempt: G.attempt, top: st ? RANKS[rk(st.top)] : null, deck: st ? st.stock.length : null,
      onAce: st ? onGold(st) : null, open: L && st ? exposed(L, st).length : null, playable: L && st ? playable(L, st).length : null, streak: st ? st.streak : 0,
      win: st ? isWin(st) : false, coins: G.save.coins, cardsLeft: G.aliveNow ? cardsLeft() : 10000, errors: G.errors.length, camBusy: !!camTw };
  },
  play(n){ startLevel((n || 1) - 1); return this.state(); },
  spark(){ sparkFound(); return G.phase; },
  tap(q){ if (G.phase === 'play') playNode(q, 'hook'); return this.state(); },
  deck(){ deckTap(); return this.state(); },
  bot(){                                           // один ход жадного бота (или колода)
    if (G.phase === 'over'){ sparkFound(); return 'spark'; }
    if (G.phase === 'offer'){ takePlus5(); return 'plus5'; }
    if (G.phase !== 'play') return G.phase;
    const q = botPick(G.L, G.st, 'greedy', mulberry32(G.lv.moves + 1));
    if (q >= 0) playNode(q, 'bot'); else deckTap(); return q;
  },
  auto(ms){ clearInterval(this._auto); this._auto = setInterval(() => { if (G.phase === 'idle' || G.screen === 'win') clearInterval(this._auto); else this.bot(); }, ms || 300); return 'auto'; },
  plus5(take){ take === false ? declinePlus5() : takePlus5(); return this.state(); },
  goto(s){ goto(s); return G.screen; },
  drive(sec){ const end = now() + sec * 1000; let n = 0; while (now() < end && n < 100000){ safeTick(now(), false); n++; } return this.state(); },
  metrics(){ return { current: G.lv ? summarize(G.lv) : null, saved: G.save.metrics }; },
  fps(){ if (!fpsRing.length) return null; const a = fpsRing.slice().sort((x, y) => x - y), avg = a.reduce((s, x) => s + x, 0) / a.length;
    return { fps: +(1000 / avg).toFixed(1), avgMs: +avg.toFixed(2), p95Ms: +a[Math.floor(a.length * 0.95)].toFixed(2), frames: a.length }; },
  // экранные точки (client px) для проверки настоящими касаниями
  point(kind){
    const r = $('gl').getBoundingClientRect(), out = (x, y) => ({ x: Math.round(r.left + x), y: Math.round(r.top + y) });
    if (kind === 'spark' && G.L){ const c = cardCenter(G.L.gold); return out(c.x, c.y); }
    if (kind === 'deck'){ const d = deckGeo(); return out(d.x * scale, d.y * scale); }
    if (kind === 'move' && G.L && G.st){
      const q = botPick(G.L, G.st, 'greedy', mulberry32(G.lv.moves + 1));
      if (q < 0){ const d = deckGeo(); return { ...out(d.x * scale, d.y * scale), deck: true }; }
      const pl = [q, ...playable(G.L, G.st).filter(x => x !== q)], v = pickVisibleTarget(pl, nodeVisible);
      if (v < 0) return null; const c = cardCenter(G.L.nodes[v]); return { ...out(c.x, c.y), node: v };
    }
    if (kind === 'closed' && G.L && G.st){ for (let q = 0; q < G.L.n; q++) if (G.st.present[q] && G.st.cover[q] > 0 && q !== G.L.goldIdx){ const c = cardCenter(G.L.nodes[q]); if (pickCard(c.x, c.y) === G.L.nodes[q]) return out(c.x, c.y); } return null; }
    const b = document.querySelector('[data-act="' + kind + '"]'); if (b){ const br = b.getBoundingClientRect(); return { x: Math.round(br.left + br.width / 2), y: Math.round(br.top + br.height / 2) }; }
    return null;
  },
  // размер карт ямы на экране, CSS px: ширина и высота проекции (мин / среднее), ранг ≈ 0,52 высоты карты
  cardPx(){ if (!G.L) return null; const W = [], Hh = [];
    for (let q = 0; q < G.L.n; q++){ if (!G.st.present[q]) continue; const Q = cardQuad(G.L.nodes[q]); W.push(Math.hypot(Q[1].x - Q[0].x, Q[1].y - Q[0].y)); Hh.push(Math.hypot(Q[3].x - Q[0].x, Q[3].y - Q[0].y)); }
    const avg = (a) => +(a.reduce((x, y) => x + y, 0) / a.length).toFixed(1), mn = (a) => +Math.min(...a).toFixed(1);
    return { w: avg(W), h: avg(Hh), wMin: mn(W), hMin: mn(Hh), rank: +(avg(Hh) * 0.52).toFixed(1), pitch: +(CAM.pitch * 180 / Math.PI).toFixed(0) }; },
  // видимость открытых карт ямы: центр на экране, что лежит под центром (карта стога), видна ли рука-цель
  vis(){ if (!G.L) return null; return openNodes().map(q => { const i = G.L.nodes[q], c = cardCenter(i), hit = pickCard(c.x, c.y);
    return { q, rank: RANKS[rk(G.st.tab[q])], fit: ok(rk(G.st.top), rk(G.st.tab[q])), x: Math.round(c.x), y: Math.round(c.y), self: i, hit, hitNode: hit >= 0 ? G.nodeOf[hit] : -1, visible: nodeVisible(q) }; }); },
  settle(){ if (camTw){ Object.assign(CAM, camTw.b); const d = camTw.done; camTw = null; log('fx.end', 'cam.settle'); if (d) d(); } G.phaseUntil = Math.min(G.phaseUntil, now()); safeTick(now(), false); placeCamera(now()); return this.state(); },   // для тестов: довести камеру и таймеры фаз
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// ---------------------------------------------------------------------------
// Старт: шрифт → стог (граф перекрытий из сима) → укладка → атлас → сцена → прогрев отрисовкой
// ---------------------------------------------------------------------------
async function boot(){
  const t0 = now();
  try { await Promise.race([document.fonts.load('900 100px Nunito'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  const t1 = now(); pile(); const tPile = now() - t1;
  fit(); initScene(); fit();
  G.aliveNow = aliveFromSave(); refreshData();
  // прогрев: кадр на общем плане и в яме — шейдер, буферы и атлас готовятся до первого хода
  const hOver = overHome(Math.min(G.save.level, LEVELS.length - 1)); Object.assign(CAM, hOver); home = { ...hOver };
  placeCamera(now()); S.renderer.render(S.scene, S.camera);
  const L0 = levelPit(Math.min(G.save.level, LEVELS.length - 1)); Object.assign(CAM, pitHome(L0)); placeCamera(now()); S.renderer.render(S.scene, S.camera);
  Object.assign(CAM, hOver); placeCamera(now()); S.renderer.render(S.scene, S.camera);
  $('loading').remove(); hud();
  const h = location.hash.slice(1); routeHash(h || 'menu');
  requestAnimationFrame(frame);
  log('event', 'boot', 'levels=' + LEVELS.length + ' pile=' + Math.round(tPile) + 'ms total=' + Math.round(now() - t0) + 'ms');
}
setTimeout(boot, 20);
}
